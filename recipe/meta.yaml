{% set name = "kennard-stone" %}
{% set version = "4.1.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/kennard_stone-{{ version }}.tar.gz
  sha256: 979a0dc2cb3c687fcb3d74010bc33b4bbc9625cc544c7f89c7c110abb57806bf

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77.0.3
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.20.0
    - scikit-learn <1.10

test:
  imports:
    - kennard_stone
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/yu9824/kennard_stone
  summary: A method for selecting samples by spreading the training data evenly.
  dev_url: https://github.com/yu9824/kennard_stone
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - yu9824
