{% set name = "kennard-stone" %}
{% set version = "3.0.2" %}
{% set python_min = "3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/kennard_stone-{{ version }}.tar.gz
  sha256: 004734ffe066e4d3e085dd0d410c7ce192abfe517488e3d78099f8f2aeb25ba5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.20.0
    - scikit-learn
    - typing_extensions >=4.9.0

test:
  imports:
    - kennard_stone
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/yu9824/kennard_stone
  summary: A method for selecting samples by spreading the training data evenly.
  dev_url: https://github.com/yu9824/kennard_stone
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - yu9824
